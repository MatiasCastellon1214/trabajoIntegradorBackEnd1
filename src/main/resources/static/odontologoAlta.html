<!DOCTYPE html>
<html lang="es">
<head>
    <title>Odontologos</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="js/odontologos/post.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }

        .nav-link {
            color: #bbb;
        }

        .nav-link:hover {
            color: #fff;
            background-color: #333;
        }

        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .form-control {
            background-color: #2a2a2a;
            color: #fff;
            border-color: #444;
        }

        .form-control:focus {
            background-color: #333;
            color: #fff;
            border-color: #888;
        }

        label {
            color: #ddd;
        }

        hr {
            border-color: #555;
        }

        .btn-danger {
            background-color: #bb2d3b;
            border-color: #bb2d3b;
        }

        .btn-danger:hover {
            background-color: #a71d2a;
            border-color: #a71d2a;
        }
    </style>
</head>
<body>
<div class="container">
    <ul class="nav nav-pills">
        <li class="nav-item">
            <a class="nav-link" href="odontologosList.html">Administración Odontólogos</a>
        </li>
    </ul>
    <div class="row">
        <div class="col-sm-7">
            <h3>Agregar Odontólogo</h3>
            <form id="add_new_odontologo">
                <div class="form-group">
                    <label for="matricula">Matrícula:</label>
                    <input type="number" class="form-control" id="matricula"
                           placeholder="Ingrese la matrícula" name="matricula" required>
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" class="form-control" id="nombre"
                           placeholder="Ingrese el nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido:</label>
                    <input type="text" class="form-control" id="apellido"
                           placeholder="Ingrese el apellido" name="apellido" required>
                </div>
                <button type="submit" class="btn btn-danger" id="btn-add-new-odontologo">Guardar</button>
            </form>
            <div id="response" style="display:none; margin-top:10px"></div>
        </div>
    </div>
</div>
</body>
</html>
