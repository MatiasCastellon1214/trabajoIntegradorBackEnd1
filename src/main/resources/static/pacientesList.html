<!DOCTYPE html>
<html lang="es">
<head>
    <title>Pacientes</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="js/pacientes/list.js"></script>
    <script type="text/javascript" src="js/pacientes/put.js"></script>
    <script type="text/javascript" src="js/pacientes/delete.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }

        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .nav-link {
            color: #fff !important;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link.active {
            color: #fff !important;
            background-color: #333 !important;
        }

        table {
            color: #fff;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #2a2a2a;
        }

        .table-striped tbody tr:nth-of-type(even) {
            background-color: #1e1e1e;
        }

        .form-control {
            background-color: #2a2a2a;
            color: #ffffff;
            border-color: #444;
        }

        .form-control:focus {
            background-color: #333;
            color: #fff;
            border-color: #888;
        }

        .form-group {
            color: #ffffff;
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }

        #response {
            background-color: #2e2e2e;
            padding: 10px;
            border-radius: 3px;
            color: #fff;
        }

        th, td{
        color: #ffffff;
        }
    </style>
</head>
<body>
<div class="container">
    <ul class="nav nav-pills mb-3">
        <li class="nav-item">
            <a class="nav-link" href="pacienteAlta.html">Agregar nuevo</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="index.html">Volver al índice</a>
        </li>
    </ul>

    <div id="div_paciente_table">
        <h1>Pacientes</h1>
        <div class="row col-md-20 table-responsive">
            <table id="pacienteTable" class="table table-striped">
                <thead>
                <tr>
                    <th>Id (click en el botón Id para actualizar datos)</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <div class="row">
        <div class="col-sm-6" style="display: none; background-color:#2e2e2e; padding:10px; border-radius:3px"
             id="div_paciente_updating">
            <form id="update_paciente_form">
                <div class="form-group">
                    <label for="paciente_id">Id:</label>
                    <input type="text" class="form-control" id="paciente_id" readonly>
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" class="form-control" placeholder="Nombre" id="nombre">
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido:</label>
                    <input type="text" class="form-control" placeholder="Apellido" id="apellido">
                </div>

                <button type="submit" class="btn btn-primary">Modificar</button>
            </form>
            <div id="response" style="display:none; margin:10px"></div>
        </div>
    </div>
    <hr>
</div>
</body>
</html>
