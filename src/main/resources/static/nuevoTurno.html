<!DOCTYPE html>
<html lang="es">
<head>
    <title>Nuevo Turno</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="js/turnos/post.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }

        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .nav-link {
            color: #bbb;
        }

        .nav-link:hover {
            color: #fff;
            background-color: #333;
        }

        .form-control {
            background-color: #2a2a2a;
            color: #fff;
            border-color: #444;
        }

        .form-control:focus {
            background-color: #333;
            color: #fff;
            border-color: #888;
        }

        label {
            color: #ddd;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #bb2d3b;
            border-color: #b02a37;
        }

        #response {
            background-color: #2e2e2e;
            padding: 10px;
            border-radius: 3px;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="container">
    <ul class="nav nav-pills mb-3">
        <li class="nav-item">
            <a class="nav-link" href="turnosList.html">Administración de Turnos</a>
        </li>
    </ul>

    <div class="row">
        <div class="col-sm-7" style="background-color:#2e2e2e; padding:10px; border-radius:3px">
            <h3>Nuevo Turno</h3>
            <form id="add_new_turno">
                <div class="form-group">
                    <label for="fecha">Fecha y Hora:</label>
                    <input type="datetime-local" class="form-control" id="fecha" name="fecha" required>
                </div>
                <div class="form-group">
                    <label for="id_paciente">ID del Paciente:</label>
                    <input type="number" class="form-control" id="id_paciente" name="id_paciente" required>
                </div>
                <div class="form-group">
                    <label for="nombre_paciente">Nombre del Paciente:</label>
                    <input type="text" class="form-control" id="nombre_paciente" name="nombre_paciente" required>
                </div>
                <div class="form-group">
                    <label for="apellido_paciente">Apellido del Paciente:</label>
                    <input type="text" class="form-control" id="apellido_paciente" name="apellido_paciente" required>
                </div>
                <div class="form-group">
                    <label for="dni">DNI:</label>
                    <input type="number" class="form-control" id="dni" name="dni" required>
                </div>
                <div class="form-group">
                    <label for="fechaDeIngreso">Fecha de Ingreso:</label>
                    <input type="date" class="form-control" id="fechaDeIngreso" name="fechaDeIngreso" required>
                </div>
                <div class="form-group">
                    <label for="id_domicilio">ID del Domicilio:</label>
                    <input type="number" class="form-control" id="id_domicilio" name="id_domicilio" required>
                </div>
                <div class="form-group">
                    <label for="calle">Calle:</label>
                    <input type="text" class="form-control" id="calle" name="calle" required>
                </div>
                <div class="form-group">
                    <label for="numero_calle">Número:</label>
                    <input type="number" class="form-control" id="numero_calle" name="numero_calle" required>
                </div>
                <div class="form-group">
                    <label for="localidad">Localidad:</label>
                    <input type="text" class="form-control" id="localidad" name="localidad" required>
                </div>
                <div class="form-group">
                    <label for="provincia">Provincia:</label>
                    <input type="text" class="form-control" id="provincia" name="provincia" required>
                </div>
                <div class="form-group">
                    <label for="id_odontologo">ID del Odontólogo:</label>
                    <input type="number" class="form-control" id="id_odontologo" name="id_odontologo" required>
                </div>
                <div class="form-group">
                    <label for="matricula">Matrícula:</label>
                    <input type="number" class="form-control" id="matricula" name="matricula" required>
                </div>
                <div class="form-group">
                    <label for="nombre_odontologo">Nombre del Odontólogo:</label>
                    <input type="text" class="form-control" id="nombre_odontologo" name="nombre_odontologo" required>
                </div>
                <div class="form-group">
                    <label for="apellido_odontologo">Apellido del Odontólogo:</label>
                    <input type="text" class="form-control" id="apellido_odontologo" name="apellido_odontologo" required>
                </div>

                <button type="submit" class="btn btn-danger" id="btn-add-new-turno">Guardar</button>
            </form>
            <div id="response" style="display:none; margin-top:10px"></div>
        </div>
    </div>
</div>
</body>
</html>
